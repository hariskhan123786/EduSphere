[package]
name = "edusphere-desktop"
version = "2.0.0"
description = "EduSphere AI — Enterprise School Management Desktop Application"
authors = ["EduSphere AI Team"]
license = ""
repository = ""
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "edusphere_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-ico", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
tauri-plugin-shell = "2"

# SQLite
rusqlite = { version = "0.31", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.24"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client for Supabase sync
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# UUID generation
uuid = { version = "1", features = ["v4"] }

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Crypto for password hashing
bcrypt = "0.15"

# Keyring for secure credential storage
keyring = "2"

# Error handling
anyhow = "1"
thiserror = "1"

# Logging
log = "0.4"
env_logger = "0.11"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.dev]
codegen-units = 1
debug = 0
incremental = false
opt-level = 1

[profile.dev.build-override]
codegen-units = 1
debug = 0
incremental = false
opt-level = 1

[profile.release]
codegen-units = 1
opt-level = "s"
lto = true
strip = true
